<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Cycling-Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #0b0d10;
    --panel: #151a20;
    --line: #2a323c;
    --text: #f2f4f7;
    --muted: #8a94a3;
    --accent: #3fb6ff;
    --warn: #ffb020;
    --hot: #ff4d4d;
    --z1: #b69cff;
    --z2: #3fb6ff;
    --z3: #37d67a;
    --z4: #ffb020;
    --z5: #ff4d4d;
    --zone: var(--accent);
    --btn-h: clamp(72px, 13vh, 120px);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
    touch-action: manipulation;
  }
  body.warn { --bg: #1d1605; }
  body.final { --bg: #2a0b0b; }
  body { transition: background-color .3s; }

  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto auto auto;
    padding: 1vh 1.5vw;
    gap: 1vh;
  }

  header {
    display: flex; align-items: center; gap: 1.5vw;
    font-size: clamp(14px, 2.6vh, 26px);
    color: var(--muted);
  }
  header #ver { font-size: .7em; opacity: .6; }
  header .title { color: var(--text); font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { min-height: 52px; padding: 0 1em; font-size: inherit; }

  button {
    font: inherit; color: var(--text);
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    cursor: pointer;
  }
  button:active { background: #243040; }
  button:disabled { opacity: .3; }

  main {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 3vw;
    min-height: 0;
  }
  .seg { min-width: 0; }
  .seg .name {
    font-size: clamp(32px, 10vh, 120px);
    font-weight: 800; line-height: 1.05;
    color: var(--zone);
    overflow-wrap: anywhere;
  }
  .seg .details {
    margin-top: 1.2vh;
    font-size: clamp(20px, 5.5vh, 64px);
    font-weight: 600; line-height: 1.2;
  }
  .seg .details div + div { margin-top: .25em; }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: clamp(64px, min(27vh, 24vw), 320px);
    font-weight: 800; line-height: 1;
    letter-spacing: -.02em;
  }
  body.warn .clock { color: var(--warn); }
  body.final .clock { color: var(--hot); animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .pause-badge {
    position: absolute; right: 0; top: 0;
    display: none;
    font-size: clamp(20px, 5vh, 48px); font-weight: 800; letter-spacing: .15em;
    color: var(--bg); background: var(--warn);
    padding: .15em .6em; border-radius: 10px;
  }
  body.paused .pause-badge { display: block; }
  body.paused .clock { opacity: .5; }

  .bar { height: 1.4vh; min-height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--zone); }

  .nextline {
    display: flex; gap: 1.5vw; align-items: baseline;
    font-size: clamp(16px, 3.8vh, 40px);
    color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  .nextline .next { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }

  .controls {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1.6fr 1fr 1fr;
    gap: clamp(8px, 1.2vw, 16px);
  }
  .controls button {
    height: var(--btn-h);
    font-size: clamp(18px, 3.4vh, 32px); font-weight: 700;
    display: grid; place-items: center; line-height: 1.1;
  }
  .controls button small { display: block; font-size: .55em; font-weight: 500; color: var(--muted); }
  .controls #btnPlay { background: #12324a; border-color: var(--accent); font-size: clamp(24px, 4.5vh, 44px); }
  body.paused .controls #btnPlay { background: #3a2a06; border-color: var(--warn); }

  #toast {
    position: fixed; left: 50%; top: 12vh; transform: translateX(-50%);
    background: #f2f4f7; color: #0b0d10;
    font-size: clamp(18px, 4vh, 36px); font-weight: 700;
    padding: .4em 1em; border-radius: 12px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  .overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: none; flex-direction: column; gap: 1vh; padding: 1.5vh 1.5vw;
  }
  .overlay.open { display: flex; }
  .overlay .row { display: flex; gap: 1vw; flex-wrap: wrap; align-items: center; }
  .overlay .row button, .overlay .row label {
    min-height: 64px; padding: 0 1.2em;
    font-size: 20px; display: inline-flex; align-items: center;
    color: var(--text); background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
  }
  .overlay .row h2 { margin: 0 0 0 1vw; font-size: 24px; flex: 1; }

  #list .items { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 2vh; }
  #list .items button {
    min-height: 84px; width: 100%;
    display: grid; grid-template-columns: 3em 1fr auto auto; gap: 1em; align-items: center;
    text-align: left; padding: 0 1em; font-size: clamp(18px, 3.2vh, 30px);
    border-left: 12px solid var(--z, var(--accent));
  }
  #list .items button.current { border-color: var(--text); border-left-color: var(--z, var(--accent)); background: #1e2833; }
  #list .items .n { color: var(--muted); }
  #list .items .d { color: var(--muted); font-size: .8em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #list .items .t { font-variant-numeric: tabular-nums; }
  #list .items .at { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .8em; }

  #editor textarea {
    flex: 1; width: 100%;
    background: var(--panel); color: var(--text);
    border: 2px solid var(--line); border-radius: 12px;
    font: 18px/1.5 ui-monospace, "Roboto Mono", monospace;
    padding: 1em;
    -webkit-user-select: text; user-select: text;
  }
  #editor .err { color: var(--hot); font-size: 18px; }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; align-content: center; }
    .clock { font-size: clamp(64px, 22vw, 300px); }
    .controls { grid-template-columns: repeat(3, 1fr); }
    .controls #btnPlay { grid-column: span 3; order: -1; }
  }
</style>
</head>
<body class="paused">
<div id="app">
  <header>
    <span class="title" id="title"></span>
    <span id="ver">v7</span>
    <span id="pos"></span>
    <span id="total"></span>
    <button id="btnPlan" type="button">Plan</button>
    <button id="btnMusik" type="button">Musik</button>
    <button id="btnFull" type="button">Vollbild</button>
  </header>
  <main>
    <div class="pause-badge">PAUSE</div>
    <div class="seg">
      <div class="name" id="name"></div>
      <div class="details" id="details"></div>
    </div>
    <div class="clock" id="clock">0:00</div>
  </main>
  <div class="bar"><div id="bar"></div></div>
  <div class="nextline">
    <span>Danach:</span>
    <span class="next" id="next"></span>
  </div>
  <div class="controls">
    <button id="btnUndo" type="button">↶<small>rückgängig</small></button>
    <button id="btnMinus" type="button">−30<small>Sek.</small></button>
    <button id="btnPlus" type="button">+30<small>Sek.</small></button>
    <button id="btnPrev" type="button">◀<small>zurück</small></button>
    <button id="btnPlay" type="button">Start</button>
    <button id="btnNext" type="button">▶<small>weiter</small></button>
    <button id="btnList" type="button">☰<small>Liste</small></button>
  </div>
</div>

<div id="toast"></div>

<div id="list" class="overlay">
  <div class="row">
    <button id="listClose" type="button">Schließen</button>
    <h2>Springen zu …</h2>
  </div>
  <div class="items" id="listItems"></div>
</div>

<div id="editor" class="overlay">
  <div class="row">
    <button id="edApply" type="button">Übernehmen</button>
    <label>Datei öffnen <input id="edFile" type="file" accept=".txt,.md,text/plain" hidden></label>
    <button id="edDemo" type="button">Beispiel laden</button>
    <button id="edClose" type="button">Abbrechen</button>
  </div>
  <div class="err" id="edErr"></div>
  <textarea id="edText" spellcheck="false"></textarea>
</div>

<script>
const DEMO = `Titel: Berg und Sprint (Demo)

# Dauer  Abschnitt | Detail | Detail ...
# Dauer als m:ss oder Minuten. Z1 bis Z5 färbt den Abschnitt.

3:30  Warm-up | sitzend, locker | 85–95 RPM | Z1
4:00  Anstieg | sitzend, Widerstand +1 je Refrain | 70–80 RPM | Z3
0:45  Erholung | locker rollen, trinken | Z1
3:45  Berg | stehend ab dem Refrain | 60–70 RPM | Z4
1:00  Erholung | sitzend | Z1
0:30  Sprint | alles raus | 110+ RPM | Z5
0:30  Pause | locker | Z1
0:30  Sprint | alles raus | 110+ RPM | Z5
4:00  Cool-down | sitzend, leicht | Dehnen am Rad | Z1`;

const PLAN_KEY = 'cycling-plan:text';
const RUN_KEY = 'cycling-plan:run';
const STEP = 30000;
const RESTART_WINDOW = 3000;

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

function parseDuration(s) {
  if (/^\d+:\d{1,2}$/.test(s)) {
    const [m, sec] = s.split(':').map(Number);
    return (m * 60 + sec) * 1000;
  }
  if (/^\d+(?:[.,]\d+)?$/.test(s)) return Math.round(parseFloat(s.replace(',', '.')) * 60) * 1000;
  return null;
}

function parsePlan(text) {
  let title = 'Cycling-Plan';
  const segments = [];
  const errors = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const t = line.match(/^titel:\s*(.+)$/i);
    if (t) { title = t[1]; return; }
    const m = line.match(/^(\S+)\s+(.+)$/);
    const ms = m && parseDuration(m[1]);
    if (!ms) { errors.push(`Zeile ${i + 1}: "${line}" – Dauer fehlt oder unlesbar`); return; }
    const parts = m[2].split('|').map(p => p.trim()).filter(Boolean);
    const zoneIdx = parts.findIndex(p => /^Z[1-5]$/i.test(p));
    const zone = zoneIdx >= 0 ? parts.splice(zoneIdx, 1)[0].toLowerCase() : null;
    segments.push({ ms, name: parts[0] || '', details: parts.slice(1), zone });
  });
  if (!segments.length && !errors.length) errors.push('Der Plan enthält keinen Abschnitt.');
  return { title, segments, errors };
}

function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

const $ = id => document.getElementById(id);

// segMs: Länge des laufenden Abschnitts inklusive ±30-Korrekturen
const state = { plan: null, text: '', idx: 0, left: 0, segMs: 0, running: false, last: 0 };
const undoStack = [];

function enter(idx) {
  state.idx = idx;
  state.segMs = state.plan.segments[idx].ms;
  state.left = state.segMs;
}

function finished() {
  return state.idx === state.plan.segments.length - 1 && state.left <= 0;
}

// Zeit abziehen und dabei über Abschnittsgrenzen weiterlaufen
function elapse(ms) {
  state.left -= ms;
  while (state.left <= 0) {
    if (state.idx + 1 >= state.plan.segments.length) {
      state.left = 0;
      state.running = false;
      keepAwake(false);
      break;
    }
    const over = -state.left;
    enter(state.idx + 1);
    state.left -= over;
  }
}

function load(text, resume) {
  const plan = parsePlan(text);
  if (plan.errors.length) return plan.errors;
  state.plan = plan;
  state.text = text;
  state.running = false;
  undoStack.length = 0;
  enter(0);
  store.set(PLAN_KEY, text);
  if (resume) restoreRun(); else store.del(RUN_KEY);
  render();
  return [];
}

let mySaveAt = 0;
function saveRun() {
  mySaveAt = Date.now();
  store.set(RUN_KEY, JSON.stringify({
    len: state.text.length, idx: state.idx, left: state.left, segMs: state.segMs,
    running: state.running, at: mySaveAt,
  }));
}

// Übernimmt den gespeicherten Lauf. Der gespeicherte Stand gilt als
// maßgeblich: Läuft die Anzeige in mehreren Tabs, schreibt nur der
// sichtbare, und jeder Tab holt sich beim Sichtbarwerden diesen Stand.
function restoreRun(quiet) {
  let run = null;
  try { run = JSON.parse(store.get(RUN_KEY)); } catch (e) {}
  if (!run || run.len !== state.text.length || run.idx >= state.plan.segments.length) return;
  state.idx = run.idx;
  state.segMs = run.segMs;
  state.left = run.left;
  state.running = run.running;
  if (run.running) elapse(Date.now() - run.at);
  state.last = Date.now();
  keepAwake(state.running);
  if (run.running && !quiet) toast('Lauf fortgesetzt');
}

// Jede Bedienaktion ist rückgängig zu machen
function act(label, fn) {
  undoStack.push({ idx: state.idx, left: state.left, segMs: state.segMs, running: state.running, label });
  if (undoStack.length > 50) undoStack.shift();
  fn();
  toast(label);
  saveRun();
  render();
}

function undo() {
  const h = undoStack.pop();
  if (!h) return;
  Object.assign(state, { idx: h.idx, left: h.left, segMs: h.segMs, running: h.running });
  keepAwake(state.running);
  toast(`Rückgängig: ${h.label}`);
  saveRun();
  render();
}

function adjust(delta) {
  act(delta > 0 ? '+30 Sek.' : '−30 Sek.', () => {
    if (delta > 0) {
      state.left += delta;
      state.segMs += delta;
    } else {
      const cut = Math.min(-delta, Math.max(0, state.left - 1000));
      state.left -= cut;
      state.segMs -= cut;
    }
  });
}

function prev() {
  const elapsed = state.segMs - state.left;
  if (elapsed > RESTART_WINDOW || state.idx === 0) {
    act('Abschnitt neu', () => enter(state.idx));
  } else {
    act('Zurück', () => enter(state.idx - 1));
  }
}

function next() {
  if (state.idx + 1 >= state.plan.segments.length) {
    act('Ende', () => { state.left = 0; state.running = false; keepAwake(false); });
    return;
  }
  act('Weiter', () => enter(state.idx + 1));
}

function jump(i) {
  act(`Sprung zu ${i + 1}`, () => enter(i));
}

function togglePlay() {
  act(state.running ? 'Pause' : 'Start', () => {
    if (finished()) enter(0);
    state.running = !state.running;
    keepAwake(state.running);
  });
}

function render() {
  const { plan, idx } = state;
  const seg = plan.segments[idx];
  const nextSeg = plan.segments[idx + 1];
  const restMs = state.left + plan.segments.slice(idx + 1).reduce((a, s) => a + s.ms, 0);

  $('title').textContent = plan.title;
  $('pos').textContent = `${idx + 1}/${plan.segments.length}`;
  $('total').textContent = `noch ${fmt(restMs)}`;
  $('name').textContent = seg.name;
  $('details').replaceChildren(...seg.details.map(d => Object.assign(document.createElement('div'), { textContent: d })));
  $('clock').textContent = fmt(state.left);
  $('bar').style.width = `${Math.min(100, 100 * (1 - state.left / state.segMs))}%`;
  $('next').textContent = nextSeg
    ? `${nextSeg.name}${nextSeg.details.length ? ' · ' + nextSeg.details.join(' · ') : ''} (${fmt(nextSeg.ms)})`
    : 'Ende';

  $('btnPlay').textContent = state.running ? 'Pause' : (finished() ? 'Neu' : 'Start');
  $('btnUndo').disabled = undoStack.length === 0;

  document.body.style.setProperty('--zone', seg.zone ? `var(--${seg.zone})` : 'var(--accent)');
  document.body.classList.toggle('paused', !state.running);
  document.body.classList.toggle('warn', state.running && state.left <= 10000 && state.left > 3000);
  document.body.classList.toggle('final', state.running && state.left <= 3000 && state.left > 0);
}

// Uhrzeit statt performance.now: die monotone Uhr steht unter Android
// im Tiefschlaf still, die Uhrzeit läuft weiter. Nach der Rückkehr aus dem
// Hintergrund wird die ganze Zeit auf einmal abgezogen.
let lastSave = 0;
function tick() {
  const now = Date.now();
  if (state.running) {
    elapse(Math.max(0, now - state.last));
    if (now - lastSave > 1000 && document.visibilityState === 'visible') { saveRun(); lastSave = now; }
    render();
  }
  state.last = now;
  requestAnimationFrame(tick);
}

let toastTimer = 0;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release();
    }
  } catch (e) { /* ohne Wake Lock: Bildschirm-Timeout in den Einstellungen hochsetzen */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { saveRun(); return; }
  let run = null;
  try { run = JSON.parse(store.get(RUN_KEY)); } catch (e) {}
  // Nur übernehmen, wenn zuletzt ein anderer Tab gespeichert hat
  if (run && run.at !== mySaveAt && store.get(PLAN_KEY) === state.text) {
    restoreRun(true);
    undoStack.length = 0;
  }
  render();
});

function openList() {
  let at = 0;
  const items = state.plan.segments.map((s, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    if (i === state.idx) b.className = 'current';
    if (s.zone) b.style.setProperty('--z', `var(--${s.zone})`);
    b.innerHTML = '<span class="n"></span><span><span class="nm"></span><div class="d"></div></span><span class="t"></span><span class="at"></span>';
    b.querySelector('.n').textContent = i + 1;
    b.querySelector('.nm').textContent = s.name;
    b.querySelector('.d').textContent = s.details.join(' · ');
    b.querySelector('.t').textContent = fmt(s.ms);
    b.querySelector('.at').textContent = `ab ${fmt(at)}`;
    at += s.ms;
    b.addEventListener('click', () => { $('list').classList.remove('open'); jump(i); });
    return b;
  });
  $('listItems').replaceChildren(...items);
  $('list').classList.add('open');
  $('listItems').querySelector('.current')?.scrollIntoView({ block: 'center' });
}

function openEditor() {
  $('edText').value = store.get(PLAN_KEY) || DEMO;
  $('edErr').textContent = '';
  $('editor').classList.add('open');
}

$('btnUndo').addEventListener('click', undo);
$('btnMinus').addEventListener('click', () => adjust(-STEP));
$('btnPlus').addEventListener('click', () => adjust(STEP));
$('btnPrev').addEventListener('click', prev);
$('btnPlay').addEventListener('click', togglePlay);
$('btnNext').addEventListener('click', next);
$('btnList').addEventListener('click', openList);
$('listClose').addEventListener('click', () => $('list').classList.remove('open'));

$('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});

$('btnMusik').addEventListener('click', () => { location.href = 'musik.html'; });

$('btnPlan').addEventListener('click', () => {
  if (state.running) togglePlay();
  openEditor();
});
$('edClose').addEventListener('click', () => $('editor').classList.remove('open'));
$('edDemo').addEventListener('click', () => { $('edText').value = DEMO; });
$('edApply').addEventListener('click', () => {
  const errs = load($('edText').value, false);
  if (errs.length) { $('edErr').textContent = errs.join(' · '); return; }
  $('editor').classList.remove('open');
});
$('edFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) $('edText').value = await f.text();
  e.target.value = '';
});

if (load(store.get(PLAN_KEY) || DEMO, true).length) load(DEMO, false);
state.last = Date.now();
requestAnimationFrame(tick);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
