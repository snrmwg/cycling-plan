<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Cycling-Plan</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #151a20;
    --text: #f2f4f7;
    --muted: #8a94a3;
    --accent: #3fb6ff;
    --warn: #ffb020;
    --hot: #ff4d4d;
    --z1: #a3aebd;
    --z2: #3fb6ff;
    --z3: #37d67a;
    --z4: #ffb020;
    --z5: #ff4d4d;
    --zone: var(--accent);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  body.warn { --bg: #1d1605; }
  body.final { --bg: #2a0b0b; }
  body { transition: background-color .3s; }

  #app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto auto;
    padding: 1.2vh 2vw;
    gap: 1.2vh;
  }

  header {
    display: flex; align-items: center; gap: 2vw;
    font-size: clamp(14px, 2.6vh, 28px);
    color: var(--muted);
  }
  header .title { color: var(--text); font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button {
    font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid #2a323c; border-radius: 8px;
    padding: .3em .8em;
  }

  main {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 3vw;
    min-height: 0;
  }
  .seg { min-width: 0; }
  .seg .name {
    font-size: clamp(32px, 11vh, 140px);
    font-weight: 800; line-height: 1.05;
    color: var(--zone);
    overflow-wrap: anywhere;
  }
  .seg .details {
    margin-top: 1.5vh;
    font-size: clamp(20px, 6vh, 72px);
    font-weight: 600; line-height: 1.2;
  }
  .seg .details div + div { margin-top: .3em; }
  .clock {
    font-variant-numeric: tabular-nums;
    font-size: clamp(64px, 30vh, 360px);
    font-weight: 800; line-height: 1;
    letter-spacing: -.02em;
  }
  body.warn .clock { color: var(--warn); }
  body.final .clock { color: var(--hot); animation: pulse 1s steps(2) infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  .bar { height: 1.6vh; min-height: 8px; background: var(--panel); border-radius: 99px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--zone); }

  footer {
    display: flex; gap: 2vw; align-items: baseline;
    font-size: clamp(16px, 4.2vh, 48px);
    color: var(--muted);
    white-space: nowrap; overflow: hidden;
  }
  footer .next { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  footer .label { flex: none; }

  .paused .clock { opacity: .45; }
  #hint {
    position: fixed; inset: 0;
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    pointer-events: none;
    font-size: clamp(16px, 3.5vh, 36px); color: var(--muted);
  }
  #hint > div { display: grid; place-items: center; border: 2px dashed #2a323c; margin: 6vh .5vw; border-radius: 12px; background: rgba(11,13,16,.6); }
  #hint.hidden { display: none; }

  #editor {
    position: fixed; inset: 0; background: var(--bg);
    display: none; flex-direction: column; gap: 1vh; padding: 2vh 2vw;
  }
  #editor.open { display: flex; }
  #editor textarea {
    flex: 1; width: 100%;
    background: var(--panel); color: var(--text);
    border: 1px solid #2a323c; border-radius: 8px;
    font: 18px/1.5 ui-monospace, "Roboto Mono", monospace;
    padding: 1em;
  }
  #editor .row { display: flex; gap: 1vw; flex-wrap: wrap; }
  #editor button, #editor label {
    font: 18px system-ui, sans-serif; color: var(--text);
    background: var(--panel); border: 1px solid #2a323c; border-radius: 8px;
    padding: .5em 1em;
  }
  #editor .err { color: var(--hot); font-size: 16px; }

  @media (orientation: portrait) {
    main { grid-template-columns: 1fr; align-content: center; }
    .clock { font-size: clamp(64px, 22vw, 300px); }
  }
</style>
</head>
<body class="paused">
<div id="app">
  <header>
    <span class="title" id="title"></span>
    <span id="pos"></span>
    <span id="total"></span>
    <button id="btnPlan" type="button">Plan</button>
    <button id="btnFull" type="button">Vollbild</button>
  </header>
  <main id="stage">
    <div class="seg">
      <div class="name" id="name"></div>
      <div class="details" id="details"></div>
    </div>
    <div class="clock" id="clock">0:00</div>
  </main>
  <div class="bar"><div id="bar"></div></div>
  <footer>
    <span class="label">Danach:</span>
    <span class="next" id="next"></span>
  </footer>
</div>

<div id="hint">
  <div>&larr; zurück</div>
  <div>Start / Pause</div>
  <div>weiter &rarr;</div>
</div>

<div id="editor">
  <div class="row">
    <button id="edApply" type="button">Übernehmen</button>
    <label>Datei öffnen <input id="edFile" type="file" accept=".txt,.md,text/plain" hidden></label>
    <button id="edDemo" type="button">Beispiel laden</button>
    <button id="edClose" type="button">Abbrechen</button>
  </div>
  <div class="err" id="edErr"></div>
  <textarea id="edText" spellcheck="false"></textarea>
</div>

<script>
const DEMO = `Titel: Berg und Sprint (Demo)

# Dauer  Abschnitt | Detail | Detail ...
# Dauer als m:ss oder Minuten. Z1 bis Z5 färbt den Abschnitt.

3:30  Warm-up | sitzend, locker | 85–95 RPM | Z1
4:00  Anstieg | sitzend, Widerstand +1 je Refrain | 70–80 RPM | Z3
0:45  Erholung | locker rollen, trinken | Z1
3:45  Berg | stehend ab dem Refrain | 60–70 RPM | Z4
1:00  Erholung | sitzend | Z1
0:30  Sprint | alles raus | 110+ RPM | Z5
0:30  Pause | locker | Z1
0:30  Sprint | alles raus | 110+ RPM | Z5
4:00  Cool-down | sitzend, leicht | Dehnen am Rad | Z1`;

const STORE_KEY = 'cycling-plan:text';

function parseDuration(s) {
  if (/^\d+:\d{1,2}$/.test(s)) {
    const [m, sec] = s.split(':').map(Number);
    return (m * 60 + sec) * 1000;
  }
  if (/^\d+(?:[.,]\d+)?$/.test(s)) return Math.round(parseFloat(s.replace(',', '.')) * 60) * 1000;
  return null;
}

function parsePlan(text) {
  let title = 'Cycling-Plan';
  const segments = [];
  const errors = [];
  text.split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith('#')) return;
    const t = line.match(/^titel:\s*(.+)$/i);
    if (t) { title = t[1]; return; }
    const m = line.match(/^(\S+)\s+(.+)$/);
    const ms = m && parseDuration(m[1]);
    if (!ms) { errors.push(`Zeile ${i + 1}: "${line}" – Dauer fehlt oder unlesbar`); return; }
    const parts = m[2].split('|').map(p => p.trim()).filter(Boolean);
    const zoneIdx = parts.findIndex(p => /^Z[1-5]$/i.test(p));
    const zone = zoneIdx >= 0 ? parts.splice(zoneIdx, 1)[0].toLowerCase() : null;
    segments.push({ ms, name: parts[0] || '', details: parts.slice(1), zone });
  });
  if (!segments.length && !errors.length) errors.push('Der Plan enthält keinen Abschnitt.');
  return { title, segments, errors };
}

function fmt(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
}

const $ = id => document.getElementById(id);
const state = { plan: null, idx: 0, left: 0, running: false, last: 0 };

function load(text) {
  const plan = parsePlan(text);
  if (plan.errors.length) return plan.errors;
  state.plan = plan;
  state.idx = 0;
  state.left = plan.segments[0].ms;
  state.running = false;
  try { localStorage.setItem(STORE_KEY, text); } catch (e) {}
  render();
  return [];
}

function go(delta) {
  const n = state.plan.segments.length;
  const target = state.idx + delta;
  if (target < 0) { state.left = state.plan.segments[0].ms; render(); return; }
  if (target >= n) { state.running = false; state.left = 0; render(); return; }
  state.idx = target;
  state.left = state.plan.segments[target].ms;
  render();
}

function render() {
  const { plan, idx } = state;
  const seg = plan.segments[idx];
  const next = plan.segments[idx + 1];
  const restMs = state.left + plan.segments.slice(idx + 1).reduce((a, s) => a + s.ms, 0);

  $('title').textContent = plan.title;
  $('pos').textContent = `${idx + 1}/${plan.segments.length}`;
  $('total').textContent = `noch ${fmt(restMs)}`;
  $('name').textContent = seg.name;
  $('details').replaceChildren(...seg.details.map(d => Object.assign(document.createElement('div'), { textContent: d })));
  $('clock').textContent = fmt(state.left);
  $('bar').style.width = `${100 * (1 - state.left / seg.ms)}%`;
  $('next').textContent = next ? `${next.name}${next.details.length ? ' · ' + next.details.join(' · ') : ''} (${fmt(next.ms)})` : 'Ende';

  document.body.style.setProperty('--zone', seg.zone ? `var(--${seg.zone})` : 'var(--accent)');
  document.body.classList.toggle('paused', !state.running);
  document.body.classList.toggle('warn', state.running && state.left <= 10000 && state.left > 3000);
  document.body.classList.toggle('final', state.running && state.left <= 3000 && state.left > 0);
}

function tick(now) {
  if (state.running) {
    state.left -= now - state.last;
    if (state.left <= 0) {
      const over = -state.left;
      if (state.idx + 1 < state.plan.segments.length) {
        state.idx += 1;
        state.left = state.plan.segments[state.idx].ms - over;
      } else {
        state.left = 0;
        state.running = false;
      }
    }
    render();
  }
  state.last = now;
  requestAnimationFrame(tick);
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && 'wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release();
    }
  } catch (e) { /* ohne Wake Lock: Bildschirm-Timeout in den Einstellungen hochsetzen */ }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.running) keepAwake(true);
});

function toggleRun() {
  if (state.left <= 0 && state.idx === state.plan.segments.length - 1) {
    state.idx = 0;
    state.left = state.plan.segments[0].ms;
  }
  state.running = !state.running;
  keepAwake(state.running);
  render();
}

document.getElementById('app').addEventListener('click', e => {
  if (e.target.closest('header')) return;
  $('hint').classList.add('hidden');
  const x = e.clientX / window.innerWidth;
  if (x < 1 / 3) go(-1);
  else if (x > 2 / 3) go(1);
  else toggleRun();
});

$('btnFull').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});

function openEditor() {
  state.running = false; keepAwake(false); render();
  let text = DEMO;
  try { text = localStorage.getItem(STORE_KEY) || DEMO; } catch (e) {}
  $('edText').value = text;
  $('edErr').textContent = '';
  $('editor').classList.add('open');
}
$('btnPlan').addEventListener('click', openEditor);
$('edClose').addEventListener('click', () => $('editor').classList.remove('open'));
$('edDemo').addEventListener('click', () => { $('edText').value = DEMO; });
$('edApply').addEventListener('click', () => {
  const errs = load($('edText').value);
  if (errs.length) { $('edErr').textContent = errs.join(' · '); return; }
  $('editor').classList.remove('open');
});
$('edFile').addEventListener('change', async e => {
  const f = e.target.files[0];
  if (f) $('edText').value = await f.text();
  e.target.value = '';
});

let initial = DEMO;
try { initial = localStorage.getItem(STORE_KEY) || DEMO; } catch (e) {}
if (load(initial).length) load(DEMO);
requestAnimationFrame(now => { state.last = now; requestAnimationFrame(tick); });
</script>
</body>
</html>
